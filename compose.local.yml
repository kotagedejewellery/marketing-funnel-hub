name: kgj-marketing-funnel-local

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: kgj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_APP_PASSWORD: local-app-password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - local-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kgj"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  local-postgres-data:

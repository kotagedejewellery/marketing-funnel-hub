name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_META_PIXEL_ID: "1234567890"
      DATABASE_URL: postgresql://kgj_app:local-app-password@127.0.0.1:54329/kgj?sslmode=disable
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:54329/kgj?sslmode=disable
      DATABASE_SSL: "false"
      ADMIN_SESSION_SECRET: ci_admin_session_secret_at_least_32_characters
      TRACKING_HMAC_SECRET: ci_tracking_hmac_secret_at_least_32_characters
      MEDIA_STORAGE_ROOT: .media-ci
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:3100/media
      META_CAPI_ACCESS_TOKEN: ci_meta_access_token_fixture
      EVENT_RATE_LIMIT_WINDOW_SECONDS: "60"
      EVENT_RATE_LIMIT_PER_IP: "30"
      EVENT_RATE_LIMIT_GLOBAL: "300"
      CRON_SECRET: ci_cron_secret_fixture_only
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
      - run: pnpm quality:check
      - name: Start local PostgreSQL
        run: docker compose -f compose.local.yml up -d --wait
      - run: pnpm db:migrate:local
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Stop local PostgreSQL
        if: always()
        run: docker compose -f compose.local.yml down -v

  publish-image:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable production image
        env:
          DOCKER_BUILD_ENV: ${{ secrets.DOCKER_BUILD_ENV }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/kotagedejewellery/marketing-funnel-hub:${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$DOCKER_BUILD_ENV" ]; then
            echo "::error::Set the DOCKER_BUILD_ENV GitHub secret before publishing a production image."
            exit 1
          fi

          umask 077
          printf '%s' "$DOCKER_BUILD_ENV" > .env.production
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin

          docker buildx build \
            --file Dockerfile \
            --tag "$IMAGE" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --secret id=app_env,src=.env.production \
            --push \
            .

  deploy:
    needs: [quality, publish-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check VPS SSH
        id: ssh_probe_1
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 1m
          command_timeout: 1m
          script: "true"
      - name: Wait before SSH retry
        if: steps.ssh_probe_1.outcome == 'failure'
        run: sleep 15
      - name: Retry VPS SSH
        id: ssh_probe_2
        if: steps.ssh_probe_1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 1m
          command_timeout: 1m
          script: "true"
      - name: Wait before final SSH retry
        if: >-
          steps.ssh_probe_1.outcome == 'failure' &&
          steps.ssh_probe_2.outcome == 'failure'
        run: sleep 15
      - name: Retry VPS SSH once more
        id: ssh_probe_3
        if: >-
          steps.ssh_probe_1.outcome == 'failure' &&
          steps.ssh_probe_2.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 1m
          command_timeout: 1m
          script: "true"
      - name: Fail when VPS SSH remains unavailable
        if: >-
          steps.ssh_probe_1.outcome == 'failure' &&
          steps.ssh_probe_2.outcome == 'failure' &&
          steps.ssh_probe_3.outcome == 'failure'
        run: |
          echo "::error::VPS menutup koneksi SSH pada tiga percobaan. Periksa sshd, firewall, dan kapasitas VPS."
          exit 1
      - name: Deploy tested revision to VPS
        if: >-
          steps.ssh_probe_1.outcome == 'success' ||
          steps.ssh_probe_2.outcome == 'success' ||
          steps.ssh_probe_3.outcome == 'success'
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ghcr.io/kotagedejewellery/marketing-funnel-hub:${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          envs: APP_IMAGE,GHCR_USERNAME,GHCR_PULL_TOKEN
          script: |
            set -euo pipefail
            revision='${{ github.sha }}'
            cd /opt/apps/sistem-marketing-funnel/marketing-funnel-hub

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Deployment dibatalkan: ada perubahan file repository di VPS."
              git status --short
              exit 1
            fi

            git fetch --depth=1 origin "$revision"
            git checkout --detach "$revision"

            if [ "$(git rev-parse HEAD)" != "$revision" ]; then
              echo "Deployment dibatalkan: SHA aktif tidak sesuai dengan SHA CI."
              exit 1
            fi

            if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_PULL_TOKEN:-}" ]; then
              echo "Deployment dibatalkan: GHCR_USERNAME atau GHCR_PULL_TOKEN belum diatur."
              exit 1
            fi

            export APP_IMAGE
            printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            docker compose -f compose.production.yml up -d db
            schema_ready="$(
              docker compose -f compose.production.yml exec -T db sh -ec '
                psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "
                  select case when
                    (
                      select count(*)
                      from pg_tables
                      where schemaname = '"'"'public'"'"'
                        and tablename in (
                          '"'"'admin_profiles'"'"', '"'"'admin_sessions'"'"', '"'"'audit_logs'"'"',
                          '"'"'branches'"'"', '"'"'branch_google_reviews'"'"',
                          '"'"'branch_meta_tracking_configs'"'"', '"'"'branch_review_sources'"'"',
                          '"'"'campaigns'"'"', '"'"'content_sections'"'"', '"'"'events'"'"', '"'"'faqs'"'"',
                          '"'"'gallery_items'"'"', '"'"'links'"'"', '"'"'product_branches'"'"',
                          '"'"'products'"'"', '"'"'site_settings'"'"'
                        )
                    ) = 16
                    and not exists (
                      select 1
                      from (
                        values
                          ('"'"'admin_profiles'"'"', '"'"'email'"'"'),
                          ('"'"'admin_profiles'"'"', '"'"'password_hash'"'"'),
                          ('"'"'admin_sessions'"'"', '"'"'token_hash'"'"'),
                          ('"'"'site_settings'"'"', '"'"'default_link_bio_branch_id'"'"'),
                          ('"'"'branch_review_sources'"'"', '"'"'scrape_limit'"'"'),
                          ('"'"'branch_meta_tracking_configs'"'"', '"'"'cta_meta_event'"'"'),
                          ('"'"'branch_meta_tracking_configs'"'"', '"'"'capi_test_event_code_encrypted'"'"')
                      ) as required(table_name, column_name)
                      where not exists (
                        select 1
                        from information_schema.columns
                        where table_schema = '"'"'public'"'"'
                          and table_name = required.table_name
                          and column_name = required.column_name
                      )
                    )
                  then '"'"'ready'"'"' else '"'"'missing'"'"' end;"
              '
            )"
            if [ "$schema_ready" != "ready" ]; then
              echo "Deployment dibatalkan: schema standalone belum siap. Jalankan migrasi manual yang telah disetujui sebelum deploy aplikasi."
              exit 1
            fi

            docker compose -f compose.production.yml pull app
            docker compose -f compose.production.yml up -d --no-build --force-recreate app
            docker compose -f compose.production.yml ps
            echo "Deployment selesai pada $revision"

# Local-only Supabase stack. Never put linked-project IDs or credentials here.
# Source: https://supabase.com/docs/guides/local-development/cli/config
project_id = "kgj-marketing-funnel-hub"

[api]
enabled = true
port = 54321

[db]
port = 54322
shadow_port = 54320
# Match the PostgreSQL major of staging/production before provisioning them.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
